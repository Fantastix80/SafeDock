name: SafeDock - CI Quality & Security Pipeline

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

jobs:
  # ============================================================
  # Job 1 : Tests unitaires — vérifie que le code compile et
  # que la logique métier est correcte sur Go 1.22 et 1.23.
  # ============================================================
  test:
    name: Unit Tests & Build Check (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.22', '1.23' ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Unit Tests (with race detector)
        run: go test -v -race -count=1 ./...

  # ============================================================
  # Job 2 : Qualité du code — golangci-lint avec une version
  # épinglée pour des résultats reproductibles.
  # ============================================================
  lint:
    name: Code Quality (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          # golangci-lint gère son propre cache — désactiver le cache Go ici
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=5m --config=.golangci.yml

  # ============================================================
  # Job 3 : Scan SAST — analyse statique de sécurité du code Go
  # avec gosec. Les exclusions sont documentées ci-dessous.
  # ============================================================
  security:
    name: SecOps Security Audit (gosec SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Gosec Security Scanner
        # Exclusions documentées et justifiées :
        #
        # G104 — Erreurs non gérées dans defer/close
        #         Pattern standard Go, géré explicitement via `_ =` dans le code.
        #
        # G304 — Chemin de fichier construit depuis une variable
        #         Le chemin de la base de données SQLite est configurable via
        #         SAFEDOCK_DB_PATH (variable d'environnement) — comportement voulu.
        #
        # G204 — exec.Command lancé avec un argument variable
        #         Les commandes trivy/dockle/grype reçoivent le nom d'image Docker
        #         comme argument. Ces noms sont extraits de l'API Docker (source de
        #         confiance interne) — pas d'injection externe possible.
        #
        # G402 — TLS InsecureSkipVerify potentiellement activé
        #         La valeur de InsecureSkipVerify est contrôlée par l'administrateur
        #         via la configuration SMTP (smtp_tls_skip_verify). Ce comportement
        #         est documenté et intentionnel pour les environnements internes.
        #
        # G703 — Path traversal dans MkdirAll
        #         Le chemin provient de SAFEDOCK_DB_PATH (variable admin) — comportement voulu.
        #
        # G706 — Log injection
        #         Les valeurs journalisées (dbPath, scannerType, containerID) sont des
        #         données internes contrôlées par l'administrateur, sans entrée externe.
        #
        # G118 — context.Background() dans une goroutine de shutdown
        #         Utilisation intentionnelle : le contexte parent est déjà annulé lors
        #         du shutdown propre, context.Background() est la seule option correcte.
        #
        # G705 — XSS via écriture d'erreur dans la réponse HTTP
        #         API REST interne, réponse en text/plain consommée par le frontend React.
        #         Aucun rendu HTML possible, risque XSS nul dans ce contexte.
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.21.4 \
            -exclude=G104,G304,G204,G402,G703,G706,G118,G705 \
            -fmt=text \
            ./...
