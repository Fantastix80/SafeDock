name: SafeDock - CI Quality & Security Pipeline

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

jobs:
  # Job 1 : Exécution des tests unitaires
  test:
    name: Unit Tests & Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.22', '1.23' ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v ./...

  # Job 2 : Analyse de Qualité du Code (Linters)
  lint:
    name: Code Quality (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run golangci-lint
        uses: golangci-lint/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  # Job 3 : Scan de Sécurité Statique (SAST Gosec)
  security:
    name: SecOps Security Audit (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Gosec Security Scanner
        # gosec scanne l'AST du code. Nous excluons G104 (erreurs non gérées dans defer/close)
        # et G304 (chargement de fichier par variable pour le chemin de la base de données)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -exclude=G104,G304 -fmt=text ./...
